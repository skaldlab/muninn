version: 1
fail-on: info

scanners:
  gitleaks:
    enabled: true
  zizmor:
    enabled: true
  actionlint:
    enabled: true
  poutine:
    enabled: true
  semgrep:
    enabled: true
    rulesets:
      - p/security-audit
      - p/secrets
  osv-scanner:
    enabled: true
  trivy:
    enabled: true
    ignore-unfixed: true
  checkov:
    enabled: true

suppressions:
  - id: testdata
    reason: >
      Intentional test fixtures (scanner sample output and integration repos).
      All secrets are fake and all vulnerabilities are deliberate.
    expires: ""

  - rule-id: PYSEC-2026-2132
    reason: >
      Transitive click 8.1.8 in requirements-scanners.txt is constrained by
      semgrep pins click~=8.1.8; the Docker image upgrades to click 8.3.3 via
      requirements-scanners.overrides (CVE-2026-7246). Remove when semgrep
      accepts click>=8.3.3 and the lockfile can be recompiled without overrides.
    expires: "2026-10-01T00:00:00Z"
