version: 1
fail-on: info

scanners:
  gitleaks:
    enabled: true
  zizmor:
    enabled: true
  actionlint:
    enabled: true
  poutine:
    enabled: true
  semgrep:
    enabled: true
    rulesets:
      - p/security-audit
      - p/secrets
  osv-scanner:
    enabled: true
  trivy:
    enabled: true
    ignore-unfixed: true
  checkov:
    enabled: true

suppressions:
  - id: testdata
    reason: >
      Intentional test fixtures (scanner sample output and integration repos).
      All secrets are fake and all vulnerabilities are deliberate.
    expires: ""

  - tool: zizmor
    rule-id: zizmor/self-repository
    reason: >
      action.yml lives at repository root; bare $/ has no subpath and is rejected
      by GitHub Actions and actionlint 1.7.12. Workspace-relative ./ with
      checkout is the compatible self-scan form until root $/ is supported.
    expires: ""
