version: 2
updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "sg0nzalez"
    labels:
      - "dependencies"
      - "go"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "sg0nzalez"
    labels:
      - "dependencies"
      - "github-actions"
    # init/analyze/upload-sarif must share one codeql-action SHA; split PRs
    # fail with "Loaded a configuration file for version X, but running Y".
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Dockerfile base images and pinned tools
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "sg0nzalez"
    labels:
      - "dependencies"
      - "docker"
    # Stay on stable CPython images. Pre-release tags (e.g. 3.15.0b3-slim) lack
    # wheels for several scanner deps, so the slim image tries to compile from
    # source and fails without gcc. Drop once 3.15.0 ships.
    ignore:
      - dependency-name: "python"
        versions:
          - ">=3.15.0a1,<3.15.0"
